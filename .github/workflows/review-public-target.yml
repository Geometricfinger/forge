name: Review public target snapshot
on:
  push:
    branches: [forge/capability-drift-review-20261113]
    paths: [.github/workflows/review-public-target.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Geometricfinger/o-iris
          ref: 4ba1ee5553ed3d9ab0387b7e131d55649032267a
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Archive public source only; no target execution
        env:
          OUT: ${{ runner.temp }}/public-target
        run: |
          mkdir -p "$OUT"
          test "$(git rev-parse HEAD)" = 4ba1ee5553ed3d9ab0387b7e131d55649032267a
          git archive --format=zip --output="$OUT/source.zip" HEAD
          git ls-tree -rl HEAD > "$OUT/git-tree.txt"
          sha256sum "$OUT/source.zip" > "$OUT/SHA256SUMS.txt"
          git rev-parse HEAD > "$OUT/source-commit.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: public-target-source-4ba1ee5
          path: ${{ runner.temp }}/public-target/
          retention-days: 14
          if-no-files-found: error
